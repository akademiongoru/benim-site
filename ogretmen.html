<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Öğretmen Girişi | Öngörü Akademi</title>


<script src="guvenlik.js"></script>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}



body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#2f2f2f;
color:white;

}



.login-box{

width:420px;
background:#1f1f1f;
padding:45px;
border-radius:25px;
border:2px solid #ff7a00;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.4);

}



.logo{

width:95px;
height:95px;
background:white;
padding:8px;
border-radius:50%;
margin-bottom:20px;

}



h1{

color:#ff7a00;
margin-bottom:10px;

}



h2{

font-size:17px;
font-weight:400;
color:#ddd;
margin-bottom:30px;

}



.input-box{

position:relative;
margin-bottom:20px;

}



.input-box i{

position:absolute;
left:15px;
top:17px;
color:#ff7a00;

}



input{

width:100%;
padding:15px 15px 15px 45px;
background:#383838;
border:none;
border-radius:10px;
color:white;
outline:none;

}



input:focus{

border:1px solid #ff7a00;

}



button{

width:100%;
padding:15px;
background:#ff7a00;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
transition:.3s;

}



button:hover{

background:white;
color:#ff7a00;

}



.back{

display:block;
margin-top:20px;
color:white;
text-decoration:none;

}



.back:hover{

color:#ff7a00;

}



</style>

</head>
<body>


<div class="login-box">



<img src="images/logo.png" class="logo">





<h1>
Öğretmen Girişi
</h1>




<h2>
Öngörü Akademi Eğitim Portalı
</h2>







<div class="input-box">

<i class="fa-solid fa-chalkboard-user"></i>


<input
id="kullanici"
type="text"
placeholder="Öğretmen Kullanıcı Adı">


</div>








<div class="input-box">


<i class="fa-solid fa-lock"></i>



<input
id="sifre"
type="password"
placeholder="Şifre">


</div>







<button onclick="ogretmenGiris()">



<i class="fa-solid fa-right-to-bracket"></i>



Giriş Yap



</button>







<a href="index.html" class="back">


← Ana Sayfaya Dön


</a>






</div>









<script>



function ogretmenGiris(){



let kullanici =

document.getElementById("kullanici").value.trim();




let sifre =

document.getElementById("sifre").value.trim();







if(kullanici==="" || sifre===""){


alert(
"Kullanıcı adı ve şifre giriniz!"
);


return;


}







if(
kullanici==="ogretmen" &&
sifre==="1234"

){



oturumAc(

"ogretmen",

"ogretmen"

);






window.location.href =

"ogretmen-paneli.html";



}

else{


alert(

"Öğretmen kullanıcı adı veya şifre hatalı!"

);


}



}




</script>





</body>

</html>
