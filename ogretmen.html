<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğretmen Paneli | Öngörü Akademi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background:#2f2f2f; color:white; padding:20px; min-height:100vh; }
    
    header { background:#1f1f1f; padding:20px; border-bottom:3px solid #ff7a00; border-radius:10px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { color:#ff7a00; font-size:24px; }
    header a, .cikis-btn { color:white; text-decoration:none; background:#ff7a00; padding:8px 15px; border-radius:8px; font-weight:bold; border:none; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:8px; }

    /* GİRİŞ EKRANI */
    .giris-kutu { max-width:400px; margin:80px auto; background:#383838; padding:30px; border-radius:15px; border-top:4px solid #ff7a00; text-align:center; }
    .giris-kutu h2 { color:#ff7a00; margin-bottom:20px; }

    input, select, textarea, button { width:100%; padding:12px; margin-bottom:12px; background:#2f2f2f; border:1px solid #444; border-radius:8px; color:white; font-size:14px; outline: none; }
    textarea { resize: vertical; min-height: 100px; }
    button { background:#ff7a00; font-weight:bold; cursor:pointer; transition:.3s; border:none; }
    button:hover { background:white; color:#ff7a00; }

    /* PANEL EKRANI */
    .panel { display:none; grid-template-columns: 1fr 1fr; gap:20px; }
    @media(max-width:900px){ .panel { grid-template-columns: 1fr; } }
    
    .kutu { background:#383838; padding:25px; border-radius:15px; border-top:4px solid #ff7a00; }
    .kutu h2 { color:#ff7a00; margin-bottom:15px; font-size:20px; display:flex; align-items:center; gap:10px; }

    /* DOSYA YÜKLEME ALANI */
    .dosya-alani { background: #252525; border: 2px dashed #ff7a00; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 12px; cursor: pointer; transition: 0.3s; }
    .dosya-alani:hover { background: #1f1f1f; }
    .dosya-alani input[type="file"] { display: none; }
    .dosya-alani label { cursor: pointer; color: #ff7a00; font-weight: bold; display: block; }

    /* PAYLAŞIM LİSTESİ */
    .liste { max-height: 500px; overflow-y: auto; margin-top: 15px; }
    .kart { background: #252525; border-left: 4px solid #ff7a00; padding: 15px; border-radius: 8px; margin-bottom: 12px; position: relative; }
    .kart h4 { color: #ff7a00; font-size: 16px; margin-bottom: 5px; }
    .kart p { font-size: 13px; color: #ddd; margin-bottom: 8px; white-space: pre-wrap; }
    .kart-bilgi { font-size: 11px; color: #aaa; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; padding-top: 8px; margin-top: 8px; }
    
    .dosya-indir-btn { display: inline-flex; align-items: center; gap: 6px; background: #ff7a00; color: white; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-size: 12px; font-weight: bold; margin-top: 5px; }
    .dosya-indir-btn:hover { background: white; color: #ff7a00; }

    .sil-btn { background: #ff3333; color: white; border: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; width: auto; margin:0; }
    .sil-btn:hover { background: #cc0000; }
    
    .hedef-rozet { background: #444; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #ff7a00; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-chalkboard-user"></i> Öngörü Akademi - Öğretmen Paneli</h1>
  <div>
    <a href="index.html"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
    <button class="cikis-btn" id="cikisBtn" style="display:none; margin-left:10px;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</button>
  </div>
</header>

<!-- GİRİŞ EKRANI -->
<div class="giris-kutu" id="girisAlani">
  <h2>Öğretmen Girişi</h2>
  <form id="ogretmenGirisForm">
    <input type="text" id="kullaniciAdi" placeholder="Kullanıcı Adı" required autofocus>
    <input type="password" id="sifre" placeholder="Şifreniz" required>
    <button type="submit">Giriş Yap</button>
  </form>
</div>

<!-- PANEL ALANI -->
<div class="panel" id="panelAlani">
  
  <!-- SOL BÖLÜM: DERS NOTU / ÖDEV PAYLAŞ -->
  <div class="kutu">
    <h2><i class="fa-solid fa-upload"></i> Ders Notu / Ödev Paylaş</h2>
    <form id="paylasimForm">
      
      <label style="font-size:12px; color:#aaa;">Hedef Seçimi:</label>
      <select id="hedefTuru" required>
        <option value="hepsi">Tüm Öğrenciler (Genel Duyuru)</option>
        <option value="sinif">Belirli Bir Sınıfa Gönder</option>
        <option value="ogrenci">Tek Bir Öğrenciye Gönder</option>
      </select>

      <!-- SINIF SEÇİM KUTUSU -->
      <div id="sinifSecimKutu" style="display:none;">
        <label style="font-size:12px; color:#aaa;">Sınıf Seçiniz:</label>
        <select id="hedefSinif">
          <option value="">Sınıf Seçin</option>
          <option value="1. Sınıf">1. Sınıf</option>
          <option value="2. Sınıf">2. Sınıf</option>
          <option value="3. Sınıf">3. Sınıf</option>
          <option value="4. Sınıf Proje OKULLARI">4. Sınıf Proje OKULLARI</option>
          <option value="5. Sınıf">5. Sınıf</option>
          <option value="6. Sınıf">6. Sınıf</option>
          <option value="7. Sınıf">7. Sınıf</option>
          <option value="8. Sınıf LGS">8. Sınıf LGS</option>
        </select>
      </div>

      <!-- ÖĞRENCİ SEÇİM KUTUSU -->
      <div id="ogrenciSecimKutu" style="display:none;">
        <label style="font-size:12px; color:#aaa;">Öğrenci Seçiniz:</label>
        <select id="hedefOgrenci">
          <option value="">Öğrenci Yükleniyor...</option>
        </select>
      </div>

      <input type="text" id="baslik" placeholder="Not / Ödev Başlığı" required>
      <textarea id="aciklama" placeholder="Açıklama, ödev detayları..." required></textarea>

      <!-- DOSYA YÜKLEME ALANI -->
      <label style="font-size:12px; color:#aaa;">Dosya Ekle (PDF, Word, JPG, PNG - İsteğe Bağlı):</label>
      <div class="dosya-alani">
        <label for="dosyaInput" id="dosyaEtiket">
          <i class="fa-solid fa-cloud-arrow-up fa-2x"></i><br>
          Dosya Seçmek İçin Tıklayın
        </label>
        <input type="file" id="dosyaInput" accept=".pdf, .doc, .docx, .jpg, .jpeg, .png">
      </div>

      <button type="submit" id="paylasBtn">Paylaş</button>
    </form>
  </div>

  <!-- SAĞ BÖLÜM: PAYLAŞILAN ÖDEVLER VE NOTLAR -->
  <div class="kutu">
    <h2><i class="fa-solid fa-clock-rotate-left"></i> Paylaştığınız Notlar ve Ödevler</h2>
    <div class="liste" id="paylasimListesi">
      <p style="color:#aaa; font-size:13px;">Yükleniyor...</p>
    </div>
  </div>

</div>

<!-- FIREBASE SİSTEMİ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4eNZiWTGnHUPSvdtCRvbymwFoBqQtqZk",
    authDomain: "weffg5-b84a8.firebaseapp.com",
    projectId: "weffg5-b84a8",
    storageBucket: "weffg5-b84a8.firebasestorage.app",
    messagingSenderId: "979023738185",
    appId: "1:979023738185:web:6327d7ba34be220de91698",
    measurementId: "G-P80RPZCSE7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let aktifOgretmen = null;

  // DOSYA SEÇİMİ VE ADI GÖSTERİMİ
  const dosyaInput = document.getElementById("dosyaInput");
  const dosyaEtiket = document.getElementById("dosyaEtiket");

  dosyaInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) {
      dosyaEtiket.innerHTML = `<i class="fa-solid fa-file-circle-check fa-2x" style="color:#2196F3;"></i><br>${e.target.files[0].name}`;
    } else {
      dosyaEtiket.innerHTML = `<i class="fa-solid fa-cloud-arrow-up fa-2x"></i><br>Dosya Seçmek İçin Tıklayın`;
    }
  });

  // HEDEF SEÇİM DİNLEMESİ
  const hedefTuru = document.getElementById("hedefTuru");
  const sinifKutu = document.getElementById("sinifSecimKutu");
  const ogrenciKutu = document.getElementById("ogrenciSecimKutu");

  hedefTuru.addEventListener("change", () => {
    const tur = hedefTuru.value;
    if (tur === "sinif") {
      sinifKutu.style.display = "block";
      ogrenciKutu.style.display = "none";
    } else if (tur === "ogrenci") {
      sinifKutu.style.display = "none";
      ogrenciKutu.style.display = "block";
    } else {
      sinifKutu.style.display = "none";
      ogrenciKutu.style.display = "none";
    }
  });

  // SAYFA YÜKLENDİĞİNDE GİRİŞ / OTURUM KONTROLÜ
  document.addEventListener("DOMContentLoaded", () => {
    const kayitli = localStorage.getItem("ongoru_ogretmen");
    if (kayitli) {
      try {
        aktifOgretmen = JSON.parse(kayitli);
        if(aktifOgretmen && aktifOgretmen.id) {
          paneliAc();
        } else {
          cikisYap();
        }
      } catch(e) {
        cikisYap();
      }
    } else {
      cikisYap();
    }
  });

  // ÖĞRETMEN GİRİŞ FORMU
  document.getElementById("ogretmenGirisForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const kAdi = document.getElementById("kullaniciAdi").value.toLowerCase().trim();
    const sifre = document.getElementById("sifre").value.trim();

    try {
      const q = query(collection(db, "kullanicilar"), where("kullaniciAdi", "==", kAdi), where("sifre", "==", sifre), where("rol", "==", "ogretmen"));
      const snap = await getDocs(q);

      if (!snap.empty) {
        const docSnap = snap.docs[0];
        aktifOgretmen = { id: docSnap.id, ...docSnap.data() };
        localStorage.setItem("ongoru_ogretmen", JSON.stringify(aktifOgretmen));
        paneliAc();
      } else {
        alert("Kullanıcı adı veya şifre hatalı!");
      }
    } catch (err) {
      alert("Giriş hatası: " + err.message);
    }
  });

  function paneliAc() {
    document.getElementById("girisAlani").style.display = "none";
    document.getElementById("panelAlani").style.display = "grid";
    document.getElementById("cikisBtn").style.display = "inline-flex";

    ogrencileriYukle();
    paylasimlariCanliIzle();
  }

  function cikisYap() {
    localStorage.removeItem("ongoru_ogretmen");
    document.getElementById("girisAlani").style.display = "block";
    document.getElementById("panelAlani").style.display = "none";
    document.getElementById("cikisBtn").style.display = "none";
  }

  document.getElementById("cikisBtn").addEventListener("click", cikisYap);

  // ÖĞRENCİLERİ DROPDOWN'A YÜKLEME
  async function ogrencileriYukle() {
    const select = document.getElementById("hedefOgrenci");
    select.innerHTML = "<option value=''>Öğrenci Seçiniz</option>";
    try {
      const q = query(collection(db, "kullanicilar"), where("rol", "==", "ogrenci"));
      const snap = await getDocs(q);
      snap.forEach(docSnap => {
        const u = docSnap.data();
        select.innerHTML += `<option value="${docSnap.id}">${u.adSoyad} (${u.sinif || 'Sınıfsız'})</option>`;
      });
    } catch (err) {
      console.error("Öğrenciler çekilemedi:", err);
    }
  }

  // ÖDEV / NOT PAYLAŞMA
  document.getElementById("paylasimForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("paylasBtn");
    btn.disabled = true;
    btn.innerText = "Yükleniyor ve Paylaşılıyor...";

    try {
      const tur = hedefTuru.value;
      let hedefSinifVal = "";
      let hedefOgrenciVal = "";

      if (tur === "sinif") {
        hedefSinifVal = document.getElementById("hedefSinif").value;
        if (!hedefSinifVal) { 
          alert("Lütfen bir sınıf seçin!"); 
          return; 
        }
      } else if (tur === "ogrenci") {
        hedefOgrenciVal = document.getElementById("hedefOgrenci").value;
        if (!hedefOgrenciVal) { 
          alert("Lütfen bir öğrenci seçin!"); 
          return; 
        }
      }

      let dosyaUrl = "";
      let dosyaAdi = "";

      if (dosyaInput.files.length > 0) {
        const file = dosyaInput.files[0];
        dosyaAdi = file.name;
        
        const temizAd = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
        const storageRef = ref(storage, `odevler/${Date.now()}_${temizAd}`);

        const uploadTask = await uploadBytes(storageRef, file);
        dosyaUrl = await getDownloadURL(uploadTask.ref);
      }

      await addDoc(collection(db, "paylasimlar"), {
        ogretmenId: aktifOgretmen.id,
        ogretmenAd: aktifOgretmen.adSoyad,
        brans: aktifOgretmen.brans || "",
        baslik: document.getElementById("baslik").value.trim(),
        aciklama: document.getElementById("aciklama").value.trim(),
        hedefTuru: tur,
        hedefSinif: hedefSinifVal,
        hedefOgrenciId: hedefOgrenciVal,
        dosyaUrl: dosyaUrl,
        dosyaAdi: dosyaAdi,
        tarih: new Date().toLocaleString('tr-TR')
      });

      alert("Paylaşım başarıyla gönderildi!");
      document.getElementById("paylasimForm").reset();
      dosyaEtiket.innerHTML = `<i class="fa-solid fa-cloud-arrow-up fa-2x"></i><br>Dosya Seçmek İçin Tıklayın`;
      sinifKutu.style.display = "none";
      ogrenciKutu.style.display = "none";

    } catch (err) {
      console.error("Paylaşım Hatası:", err);
      alert("Paylaşım hatası: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Paylaş";
    }
  });

  // CANLI PAYLAŞIM LİSTESİ VE SİLME
  function paylasimlariCanliIzle() {
    if(!aktifOgretmen || !aktifOgretmen.id) return;
    const q = query(collection(db, "paylasimlar"), where("ogretmenId", "==", aktifOgretmen.id));
    onSnapshot(q, (snapshot) => {
      const liste = document.getElementById("paylasimListesi");
      liste.innerHTML = "";

      if (snapshot.empty) {
        liste.innerHTML = "<p style='color:#aaa; font-size:13px;'>Henüz bir ders notu veya ödev paylaşmadınız.</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const p = docSnap.data();
        const id = docSnap.id;

        let hedefMetin = "Tüm Okul";
        if (p.hedefTuru === "sinif") hedefMetin = `Sınıf: ${p.hedefSinif}`;
        if (p.hedefTuru === "ogrenci") hedefMetin = "Özel Öğrenci";

        liste.innerHTML += `
          <div class="kart">
            <h4>${p.baslik} <span class="hedef-rozet">${hedefMetin}</span></h4>
            <p>${p.aciklama}</p>
            ${p.dosyaUrl ? `<a href="${p.dosyaUrl}" target="_blank" class="dosya-indir-btn"><i class="fa-solid fa-file-arrow-down"></i> ${p.dosyaAdi || 'Ekli Dosyayı İndir'}</a>` : ''}
            <div class="kart-bilgi">
              <span><i class="fa-regular fa-clock"></i> ${p.tarih}</span>
              <button class="sil-btn" onclick="paylasimSil('${id}')"><i class="fa-solid fa-trash"></i> Sil</button>
            </div>
          </div>
        `;
      });
    });
  }

  window.paylasimSil = async function(id) {
    if (confirm("Bu paylaşımı silmek istediğinize emin misiniz?")) {
      try {
        await deleteDoc(doc(db, "paylasimlar", id));
      } catch (err) {
        alert("Silinirken hata oluştu: " + err.message);
      }
    }
  };
</script>

</body>
</html>
