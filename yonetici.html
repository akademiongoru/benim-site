<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Paneli | Öngörü Akademi</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #222222;
      --card-bg: #2a2a2a;
      --input-bg: #1a1a1a;
      --orange: #ff6f00;
      --orange-hover: #e66300;
      --border-orange: #ff6f00;
      --text-white: #ffffff;
      --text-muted: #aaaaaa;
      --danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
    }

    /* GİRİŞ EKRANI */
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-dark);
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-orange);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-card h2 {
      color: var(--orange);
      margin-bottom: 25px;
      font-size: 22px;
      font-weight: 600;
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    .input-box input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      background: var(--input-bg);
      border: 1px solid #444;
      border-radius: 6px;
      outline: none;
      color: #fff;
      font-size: 14px;
    }

    .input-box input:focus {
      border-color: var(--orange);
    }

    .input-box .toggle-pass {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-orange {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 15px;
    }

    .btn-orange:hover {
      background: var(--orange-hover);
    }

    /* HEADER & NAVBAR */
    #panelContainer {
      display: none;
    }

    .header-bar {
      border-bottom: 2px solid var(--orange);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
    }

    .header-title {
      color: var(--orange);
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      background: var(--orange);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-danger {
      background: var(--danger);
    }

    /* PANEL DÜZENİ */
    .admin-container {
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .admin-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid var(--border-orange);
    }

    .admin-card h2 {
      color: var(--orange);
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* FORM & INPUT UYARLAMALARI */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .two-col-grid { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #ddd;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: var(--input-bg);
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--orange);
    }

    /* TABLO STİLİ (BAŞVURULAR İÇİN) */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .custom-table th {
      background: #181818;
      color: var(--orange);
      text-align: left;
      padding: 12px;
      font-size: 14px;
      border-bottom: 1px solid #444;
    }

    .custom-table td {
      padding: 12px;
      border-bottom: 1px solid #333;
      font-size: 13px;
      color: #ccc;
    }

    /* GALERİ & KART ELEMANLARI */
    .galeri-grid {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .galeri-item {
      width: 120px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      overflow: hidden;
      text-align: center;
    }

    .galeri-item img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      cursor: pointer;
    }

    .galeri-item button {
      width: 100%;
      padding: 5px;
      background: var(--danger);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="loginScreen" class="login-wrapper">
    <div class="login-card">
      <h2>Yönetici Girişi</h2>
      <div class="input-box">
        <input type="password" id="sifreInput" placeholder="Yönetici Şifreniz" onkeydown="enterKontrol(event)">
        <i class="fa-solid fa-eye toggle-pass" id="sifreToggle"></i>
      </div>
      <button class="btn-orange" onclick="girisKontrol()">Giriş Yap</button>
    </div>
  </div>

  <!-- PANEL EKRANI -->
  <div id="panelContainer">
    
    <!-- ÜST BAR -->
    <div class="header-bar">
      <div class="header-title">
        <i class="fa-solid fa-chevron-right"></i> Öngörü Akademi - Yönetici Paneli
      </div>
      <div class="header-buttons">
        <a href="index.html" class="btn-nav"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
        <button class="btn-nav btn-danger" onclick="cikisYap()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
      </div>
    </div>

    <div class="admin-container">

      <!-- DERS PROGRAMI YÖNETİMİ -->
      <div class="admin-card">
        <h2><i class="fa-solid fa-calendar-days"></i> Ders Programı Yükle</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;">
          <div>
            <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #ddd;">Sınıf Seçin:</label>
            <select id="dpSinifSecimi" style="padding: 10px; border-radius: 6px; background: var(--input-bg); color: #fff; border: 1px solid #444; min-width: 180px;">
              <option value="1. Sınıf">1. Sınıf</option>
              <option value="2. Sınıf">2. Sınıf</option>
              <option value="3. Sınıf">3. Sınıf</option>
              <option value="4. Sınıf">4. Sınıf</option>
              <option value="5. Sınıf">5. Sınıf</option>
              <option value="6. Sınıf">6. Sınıf</option>
              <option value="7. Sınıf">7. Sınıf</option>
              <option value="8. Sınıf">8. Sınıf</option>
            </select>
          </div>

          <div>
            <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #ddd;">Ders Programı Görseli:</label>
            <input type="file" id="dpGorselInput" accept="image/*" style="color: #fff;">
          </div>

          <div style="margin-top: 18px;">
            <button type="button" onclick="dersProgramiYukle()" class="btn-orange" style="padding: 10px 20px;">
              <i class="fa-solid fa-upload"></i> Yükle
            </button>
          </div>
        </div>

        <h3 style="font-size: 15px; margin-bottom: 10px; color: var(--orange);">Kayıtlı Ders Programları</h3>
        <div id="dersProgramlariListesi" class="galeri-grid">
          <!-- Firebase Dinamik Veri -->
        </div>
      </div>

      <!-- GALERİ YÖNETİMİ -->
      <div class="admin-card">
        <h2><i class="fa-solid fa-images"></i> Galeri Yönetimi</h2>
        <div style="display:flex; gap:10px; margin-bottom:15px; align-items: center;">
          <input type="file" id="galeriInput" accept="image/*" style="color:#fff;">
          <button class="btn-orange" style="width: auto; padding: 10px 20px;" onclick="galeriEkle()"><i class="fa-solid fa-plus"></i> Yükle</button>
        </div>
        <div id="galeriContainer" class="galeri-grid"></div>
      </div>

      <!-- GELEN BAŞVURULAR -->
      <div class="admin-card">
        <h2><i class="fa-solid fa-inbox"></i> Gelen Başvurular (Bilgi Formu)</h2>
        <table class="custom-table">
          <thead>
            <tr>
              <th>Tarih</th>
              <th>Öğrenci Ad Soyad</th>
              <th>Telefon</th>
              <th>Sınıf</th>
              <th>Mesaj</th>
              <th>İşlem</th>
            </tr>
          </thead>
          <tbody id="basvuruContainer">
            <!-- Firebase Dinamik Veri -->
          </tbody>
        </table>
      </div>

      <!-- İKİLİ FORM ALANI (ÖĞRETMEN & ÖĞRENCİ KAYDI) -->
      <div class="two-col-grid">
        
        <!-- ÖĞRETMEN KAYDI -->
        <div class="admin-card">
          <h2><i class="fa-solid fa-chalkboard-user"></i> Yeni Öğretmen Kaydı</h2>
          <form id="ogretmenForm" onsubmit="kullaniciKaydet(event, 'ogretmen')">
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogretmenAd" placeholder="Öğretmen Ad Soyad" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogretmenKadi" placeholder="Kullanıcı Adı (Örn: ahmet.hoca)" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="password" id="ogretmenSifre" placeholder="Şifre" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogretmenBrans" placeholder="Branş (Örn: Matematik)" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
              <input type="text" id="ogretmenTel" placeholder="Cep Telefonu">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
              <label>Profil Fotoğrafı Seç:</label>
              <input type="file" id="ogretmenFoto" accept="image/*">
            </div>
            <button type="submit" class="btn-orange">Öğretmen Kaydet</button>
          </form>

          <h3 style="margin-top:20px; font-size:15px; color:var(--orange);">Kayıtlı Öğretmenler</h3>
          <div id="ogretmenListesi" style="margin-top:10px;" class="galeri-grid"></div>
        </div>

        <!-- ÖĞRENCİ KAYDI -->
        <div class="admin-card">
          <h2><i class="fa-solid fa-user-graduate"></i> Yeni Öğrenci Kaydı</h2>
          <form id="ogrenciForm" onsubmit="kullaniciKaydet(event, 'ogrenci')">
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogrenciAd" placeholder="Öğrenci Ad Soyad" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogrenciOkul" placeholder="Okulu">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogrenciSinif" placeholder="Sınıfı (Örn: 7. Sınıf)">
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogrenciKadi" placeholder="Kullanıcı Adı / T.C. No" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="password" id="ogrenciSifre" placeholder="Şifre" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
              <input type="text" id="ogrenciAnne" placeholder="Anne Adı">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
              <input type="text" id="ogrenciTel" placeholder="Veli / Cep Tel">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
              <label>Öğrenci Fotoğrafı Seç (Küçük Profil):</label>
              <input type="file" id="ogrenciFoto" accept="image/*">
            </div>
            <button type="submit" class="btn-orange">Öğrenci Kaydet</button>
          </form>

          <h3 style="margin-top:20px; font-size:15px; color:var(--orange);">Kayıtlı Öğrenciler</h3>
          <div id="ogrenciListesi" style="margin-top:10px;" class="galeri-grid"></div>
        </div>

      </div>

    </div>
  </div>

  <!-- BÜYÜK RESİM MODAL -->
  <div id="imageModal" class="modal" onclick="this.style.display='none'">
    <div style="text-align:center;">
      <img id="modalImg" src="" style="max-width:90vw; max-height:85vh; object-fit:contain; border-radius:8px;">
      <p id="modalTitle" style="color:white; margin-top:10px; font-weight:600;"></p>
    </div>
  </div>

  <!-- FIREBASE VE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.onSnapshot = onSnapshot;

    const YONETICI_SIFRESI = "Ongoru34+";

    // Şifre Göster / Gizle
    document.getElementById('sifreToggle').addEventListener('click', function() {
      const input = document.getElementById('sifreInput');
      if (input.type === 'password') {
        input.type = 'text';
        this.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        this.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    // Enter Tuşu ile Giriş Kontrolü
    window.enterKontrol = function(event) {
      if (event.key === "Enter") {
        girisKontrol();
      }
    };

    // Oturum
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('adminOturum') === 'acik') {
        paneliAc();
      }
    });

    window.girisKontrol = function() {
      const sifre = document.getElementById('sifreInput').value;
      if (sifre === YONETICI_SIFRESI) {
        localStorage.setItem('adminOturum', 'acik');
        paneliAc();
      } else {
        alert("Hatalı yönetici şifresi!");
      }
    };

    window.cikisYap = function() {
      localStorage.removeItem('adminOturum');
      document.getElementById('panelContainer').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    };

    function paneliAc() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('panelContainer').style.display = 'block';
      canliDinleyiciler();
    }

    // Modal Görsel Büyütme
    window.resimBuyut = function(src, title) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modalTitle').innerText = title || '';
      document.getElementById('imageModal').style.display = 'flex';
    };

    // Görsel Sıkıştırma (Base64)
    function gorselBoyutlandir(file, maxWidth, maxHeight, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function (event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function () {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.85));
        };
      };
    }

    // DERS PROGRAMI YÜKLE
    window.dersProgramiYukle = async function() {
      const sinif = document.getElementById('dpSinifSecimi').value;
      const input = document.getElementById('dpGorselInput');

      if (!input.files || !input.files[0]) {
        alert("Lütfen görsel seçiniz.");
        return;
      }

      gorselBoyutlandir(input.files[0], 1200, 1200, async function(base64Gorsel) {
        try {
          await addDoc(collection(db, "ders_programlari"), {
            sinif: sinif,
            gorsel: base64Gorsel,
            eklemeTarihi: new Date().toLocaleString('tr-TR')
          });
          alert(`${sinif} ders programı eklendi!`);
          input.value = "";
        } catch (e) {
          console.error("Yükleme hatası:", e);
        }
      });
    };

    window.dersProgramiSil = async function(id) {
      if(confirm("Ders programı silinsin mi?")) await deleteDoc(doc(db, "ders_programlari", id));
    };

    // CANLI VERİ HAREKETLERİ
    function canliDinleyiciler() {
      // Ders Programı
      onSnapshot(collection(db, "ders_programlari"), (snapshot) => {
        const div = document.getElementById('dersProgramlariListesi');
        div.innerHTML = "";
        if (snapshot.empty) {
          div.innerHTML = "<small style='color:#888;'>Henüz yüklenmiş ders programı yok.</small>";
          return;
        }
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const id = docSnap.id;
          div.innerHTML += `
            <div class="galeri-item">
              <img src="${data.gorsel}" onclick="resimBuyut('${data.gorsel}', '${data.sinif}')">
              <div style="font-size:12px; padding:3px; background:#111; color:var(--orange);">${data.sinif}</div>
              <button onclick="dersProgramiSil('${id}')"><i class="fa-solid fa-trash"></i> Sil</button>
            </div>`;
        });
      });

      // Galeri
      onSnapshot(collection(db, "galeri"), (snapshot) => {
        const div = document.getElementById('galeriContainer');
        div.innerHTML = "";
        snapshot.forEach(docSnap => {
          const id = docSnap.id;
          const data = docSnap.data();
          div.innerHTML += `
            <div class="galeri-item">
              <img src="${data.url}" onclick="resimBuyut('${data.url}', 'Galeri')">
              <button onclick="galeriSil('${id}')"><i class="fa-solid fa-trash"></i> Sil</button>
            </div>`;
        });
      });

      // Başvurular (Tablo Yapısı)
      onSnapshot(collection(db, "basvurular"), (snapshot) => {
        const tbody = document.getElementById('basvuruContainer');
        tbody.innerHTML = "";
        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">Henüz hiç başvuru yok.</td></tr>`;
          return;
        }
        snapshot.forEach(docSnap => {
          const id = docSnap.id;
          const b = docSnap.data();
          tbody.innerHTML += `
            <tr>
              <td>${b.tarih || '-'}</td>
              <td>${b.adSoyad || '-'}</td>
              <td>${b.telefon || '-'}</td>
              <td>${b.sinif || '-'}</td>
              <td>${b.mesaj || '-'}</td>
              <td><button class="btn-danger" style="padding:4px 8px; border:none; border-radius:4px; color:#fff; cursor:pointer;" onclick="basvuruSil('${id}')">Sil</button></td>
            </tr>`;
        });
      });

      // Kullanıcılar (Öğretmen / Öğrenci)
      onSnapshot(collection(db, "kullanicilar"), (snapshot) => {
        const ogretmenDiv = document.getElementById('ogretmenListesi');
        const ogrenciDiv = document.getElementById('ogrenciListesi');
        ogretmenDiv.innerHTML = "";
        ogrenciDiv.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const id = docSnap.id;
          const u = docSnap.data();

          const cardHtml = `
            <div class="galeri-item" style="width:110px;">
              <img src="${u.foto || 'https://via.placeholder.com/100'}" onclick="resimBuyut('${u.foto}', '${u.adSoyad}')">
              <div style="font-size:11px; padding:3px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${u.adSoyad}</div>
              <button onclick="kullaniciSil('${id}')"><i class="fa-solid fa-trash"></i> Sil</button>
            </div>`;

          if (u.rol === 'ogretmen') {
            ogretmenDiv.innerHTML += cardHtml;
          } else if (u.rol === 'ogrenci') {
            ogrenciDiv.innerHTML += cardHtml;
          }
        });
      });
    }

    // DİĞER FONKSİYONLAR
    window.galeriEkle = function() {
      const file = document.getElementById('galeriInput').files[0];
      if(!file) return alert("Dosya seçiniz.");
      gorselBoyutlandir(file, 1200, 1200, async function(base64) {
        await addDoc(collection(db, "galeri"), { url: base64 });
      });
    };

    window.galeriSil = async function(id) {
      if(confirm("Silmek istiyor musunuz?")) await deleteDoc(doc(db, "galeri", id));
    };

    window.basvuruSil = async function(id) {
      if(confirm("Silmek istiyor musunuz?")) await deleteDoc(doc(db, "basvurular", id));
    };

    window.kullaniciSil = async function(id) {
      if(confirm("Kullanıcıyı silmek istiyor musunuz?")) await deleteDoc(doc(db, "kullanicilar", id));
    };

    window.kullaniciKaydet = async function(e, rol) {
      e.preventDefault();
      let veriler = { rol: rol, kayitTarihi: new Date().toLocaleDateString('tr-TR') };
      let fileInput;

      if(rol === 'ogretmen') {
        veriler.adSoyad = document.getElementById('ogretmenAd').value;
        veriler.brans = document.getElementById('ogretmenBrans').value;
        veriler.cepTel = document.getElementById('ogretmenTel').value;
        veriler.kullaniciAdi = document.getElementById('ogretmenKadi').value;
        veriler.sifre = document.getElementById('ogretmenSifre').value;
        fileInput = document.getElementById('ogretmenFoto');
      } else {
        veriler.adSoyad = document.getElementById('ogrenciAd').value;
        veriler.okul = document.getElementById('ogrenciOkul').value;
        veriler.sinif = document.getElementById('ogrenciSinif').value;
        veriler.anneAdSoyad = document.getElementById('ogrenciAnne').value;
        veriler.cepTel = document.getElementById('ogrenciTel').value;
        veriler.kullaniciAdi = document.getElementById('ogrenciKadi').value;
        veriler.sifre = document.getElementById('ogrenciSifre').value;
        fileInput = document.getElementById('ogrenciFoto');
      }

      if (fileInput.files && fileInput.files[0]) {
        gorselBoyutlandir(fileInput.files[0], 600, 600, async function(base64) {
          veriler.foto = base64;
          await addDoc(collection(db, "kullanicilar"), veriler);
          alert("Kayıt başarılı!");
          document.getElementById(rol === 'ogretmen' ? 'ogretmenForm' : 'ogrenciForm').reset();
        });
      } else {
        await addDoc(collection(db, "kullanicilar"), veriler);
        alert("Kayıt başarılı!");
        document.getElementById(rol === 'ogretmen' ? 'ogretmenForm' : 'ogrenciForm').reset();
      }
    };
  </script>
</body>
</html>
