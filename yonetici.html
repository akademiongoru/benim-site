<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Öngörü Akademi Yönetici Paneli
</title>


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:#2f2f2f;
color:white;
padding:30px;

}



.kutu{

max-width:1000px;
margin:auto;
background:#383838;
padding:30px;
border-radius:20px;

}



h1,h2{

color:#ff7a00;
margin-bottom:20px;

}



input{

width:100%;
padding:15px;
margin-bottom:15px;
border-radius:10px;
border:none;
background:#222;
color:white;

}



button{

padding:12px 20px;
background:#ff7a00;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;

}



button:hover{

background:white;
color:#ff7a00;

}



#panel{

display:none;

}



.kayit{

background:#222;
padding:20px;
margin-bottom:20px;
border-radius:15px;
border-left:4px solid #ff7a00;

}



.kayit p{

line-height:1.8;

}



.sil{

background:#d60000;
margin-top:15px;

}



.sil:hover{

background:white;
color:red;

}



.cikis{

background:#555;
margin-left:10px;

}



</style>

</head>



<body>



<div class="kutu">



<div id="giris">


<h1>

Öngörü Akademi

</h1>


<h2>

Yönetici Girişi

</h2>




<input 
type="text"
id="kullanici"
placeholder="Kullanıcı Adı">



<input 
type="password"
id="sifre"
placeholder="Şifre">



<button onclick="giris()">

Giriş Yap

</button>



</div>







<div id="panel">


<h1>

Gelen Ön Kayıtlar

</h1>



<button onclick="cikis()" class="cikis">

Çıkış

</button>


<hr><br>



<div id="liste">

</div>



</div>





</div>









<script>


function giris(){


let kullanici =
document.getElementById("kullanici").value;


let sifre =
document.getElementById("sifre").value;



if(
kullanici=="akademiongoru+" &&
sifre=="26072026"
){


document.getElementById("giris").style.display="none";


document.getElementById("panel").style.display="block";


kayitlariGetir();



}

else{


alert("Kullanıcı adı veya şifre yanlış");


}



}







function kayitlariGetir(){



let liste =
document.getElementById("liste");



let kayitlar =
JSON.parse(localStorage.getItem("basvurular")) || [];



liste.innerHTML="";




if(kayitlar.length==0){


liste.innerHTML=

"<p>Henüz kayıt bulunmamaktadır.</p>";


return;


}




kayitlar.forEach(function(kayit,index){



liste.innerHTML += `


<div class="kayit">


<p>
<b>Öğrenci:</b>
${kayit.adsoyad}
</p>


<p>
<b>Telefon:</b>
${kayit.telefon}
</p>



<p>
<b>Sınıf:</b>
${kayit.sinif}
</p>



<p>
<b>Mesaj:</b>
${kayit.mesaj}
</p>



<p>
<b>Tarih:</b>
${kayit.tarih}
</p>



<button class="sil" onclick="sil(${index})">

Kaydı Sil

</button>



</div>


`;



});



}









function sil(index){



let kayitlar =
JSON.parse(localStorage.getItem("basvurular")) || [];



kayitlar.splice(index,1);



localStorage.setItem(

"basvurular",

JSON.stringify(kayitlar)

);



kayitlariGetir();



}








function cikis(){


location.reload();


}



</script>



</body>


</html>
