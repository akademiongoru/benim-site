<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetici Paneli | Öngörü Akademi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}
body {
  background: #2f2f2f;
  color: white;
  min-height: 100vh;
}
header {
  background: #1f1f1f;
  padding: 20px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid #ff7a00;
}
.logo {
  display: flex;
  align-items: center;
  gap: 15px;
}
.logo h1 {
  color: #ff7a00;
  font-size: 24px;
}
.back-btn {
  background: #ff7a00;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

/* GİRİŞ ALANI */
.login-container {
  max-width: 400px;
  margin: 80px auto;
  background: #383838;
  padding: 30px;
  border-radius: 20px;
  border-top: 4px solid #ff7a00;
  text-align: center;
}
.login-container input {
  width: 100%;
  padding: 12px;
  margin: 15px 0;
  background: #2f2f2f;
  border: none;
  border-radius: 8px;
  color: white;
}
.login-container button {
  width: 100%;
  padding: 12px;
  background: #ff7a00;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* PANEL İÇERİK */
.panel-container {
  display: none;
  padding: 40px 8%;
  max-width: 1200px;
  margin: 0 auto;
}
.panel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 30px;
}
.card {
  background: #383838;
  padding: 25px;
  border-radius: 20px;
  border-top: 4px solid #ff7a00;
}
.card h2 {
  color: #ff7a00;
  margin-bottom: 20px;
  font-size: 20px;
}
.card input, .card select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  background: #2f2f2f;
  border: none;
  border-radius: 8px;
  color: white;
}
.card button {
  width: 100%;
  padding: 12px;
  background: #ff7a00;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
.list-box {
  margin-top: 15px;
  max-height: 300px;
  overflow-y: auto;
}
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #2f2f2f;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}
.list-item img {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 6px;
}
.delete-btn {
  background: #e74c3c;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1><i class="fa-solid fa-user-tie"></i> Öngörü Akademi Yönetim Paneli</h1>
  </div>
  <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> Ana Sayfaya Dön</a>
</header>

<!-- GİRİŞ FORMU -->
<div class="login-container" id="loginBox">
  <h2 style="color:#ff7a00; margin-bottom:15px;">Yönetici Girişi</h2>
  <input type="password" id="adminPassword" placeholder="Yönetici Şifreniz">
  <button id="loginBtn">Giriş Yap</button>
</div>

<!-- YÖNETİM PANELİ -->
<div class="panel-container" id="panelBox">

  <div class="panel-grid">

    <!-- DERS PROGRAMI YÜKLEME KARTI -->
    <div class="card">
      <h2><i class="fa-solid fa-calendar-plus"></i> Ders Programı Görseli Yükle</h2>
      <select id="progSinif">
        <option value="1. Sınıf">1. Sınıf</option>
        <option value="2. Sınıf">2. Sınıf</option>
        <option value="3. Sınıf">3. Sınıf</option>
        <option value="4. Sınıf">4. Sınıf</option>
        <option value="5. Sınıf">5. Sınıf</option>
        <option value="6. Sınıf">6. Sınıf</option>
        <option value="7. Sınıf">7. Sınıf</option>
        <option value="8. Sınıf">8. Sınıf</option>
      </select>
      <input type="text" id="progUrl" placeholder="Görsel URL Adresi (https://...)">
      <button id="progYukleBtn">Ders Programını Yayınla</button>

      <h3 style="margin-top:20px; font-size:16px; color:#ff7a00;">Yüklü Programlar</h3>
      <div class="list-box" id="progListesi">
        <!-- Dinamik Listelenecek -->
      </div>
    </div>

    <!-- GALERİ FOTOĞRAFI YÜKLEME KARTI -->
    <div class="card">
      <h2><i class="fa-solid fa-image"></i> Galeri / Slider Resmi Yükle</h2>
      <input type="text" id="galeriBaslik" placeholder="Fotoğraf Başlığı (Opsiyonel)">
      <input type="text" id="galeriUrl" placeholder="Görsel URL Adresi (https://...)">
      <button id="galeriYukleBtn">Fotoğrafı Ekle</button>

      <h3 style="margin-top:20px; font-size:16px; color:#ff7a00;">Yüklü Fotoğraflar</h3>
      <div class="list-box" id="galeriListesi">
        <!-- Dinamik Listelenecek -->
      </div>
    </div>

    <!-- ÖN KAYIT BAŞVURULARI -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2><i class="fa-solid fa-envelope"></i> Gelen Ön Kayıt Başvuruları</h2>
      <div class="list-box" id="basvuruListesi" style="max-height:400px;">
        <!-- Dinamik Listelenecek -->
      </div>
    </div>

  </div>

</div>

<!-- FIREBASE YÖNETİCİ SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4eNZiWTGnHUPSvdtCRvbymwFoBqQtqZk",
    authDomain: "weffg5-b84a8.firebaseapp.com",
    projectId: "weffg5-b84a8",
    storageBucket: "weffg5-b84a8.firebasestorage.app",
    messagingSenderId: "979023738185",
    appId: "1:979023738185:web:6327d7ba34be220de91698",
    measurementId: "G-P80RPZCSE7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ŞİFRE KONTROLÜ
  const loginBtn = document.getElementById("loginBtn");
  loginBtn.addEventListener("click", () => {
    const pwd = document.getElementById("adminPassword").value;
    if(pwd === "12345") { // Şifrenizi buradan değiştirebilirsiniz
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("panelBox").style.display = "block";
      verileriYukle();
    } else {
      alert("Hatalı Şifre!");
    }
  });

  function verileriYukle() {
    // 1. DERS PROGRAMLARINI CANLI DİNLE & LİSTELE
    onSnapshot(collection(db, "dersProgramlari"), (snapshot) => {
      const progListesi = document.getElementById("progListesi");
      progListesi.innerHTML = "";
      snapshot.forEach(docSnap => {
        const item = docSnap.data();
        const div = document.createElement("div");
        div.className = "list-item";
        div.innerHTML = `
          <img src="${item.url}" alt="Program">
          <span><strong>${item.sinif}</strong></span>
          <button class="delete-btn" onclick="document.progSil('${docSnap.id}')">Sil</button>
        `;
        progListesi.appendChild(div);
      });
    });

    // 2. GALERİ RESİMLERİNİ CANLI DİNLE & LİSTELE
    onSnapshot(collection(db, "galeri"), (snapshot) => {
      const galeriListesi = document.getElementById("galeriListesi");
      galeriListesi.innerHTML = "";
      snapshot.forEach(docSnap => {
        const item = docSnap.data();
        const div = document.createElement("div");
        div.className = "list-item";
        div.innerHTML = `
          <img src="${item.url}" alt="Galeri">
          <span>${item.baslik || 'Görsel'}</span>
          <button class="delete-btn" onclick="document.galeriSil('${docSnap.id}')">Sil</button>
        `;
        galeriListesi.appendChild(div);
      });
    });

    // 3. BAŞVURULARI DİNLE
    onSnapshot(collection(db, "basvurular"), (snapshot) => {
      const basvuruListesi = document.getElementById("basvuruListesi");
      basvuruListesi.innerHTML = "";
      snapshot.forEach(docSnap => {
        const item = docSnap.data();
        const div = document.createElement("div");
        div.className = "list-item";
        div.innerHTML = `
          <div>
            <strong>${item.ad}</strong> (${item.sinif}) - ${item.tel}<br>
            <small>${item.tarih || ''} - Mesaj: ${item.mesaj || 'Yok'}</small>
          </div>
          <button class="delete-btn" onclick="document.basvuruSil('${docSnap.id}')">Sil</button>
        `;
        basvuruListesi.appendChild(div);
      });
    });
  }

  // YENİ DERS PROGRAMI YÜKLE
  document.getElementById("progYukleBtn").addEventListener("click", async () => {
    const sinif = document.getElementById("progSinif").value;
    const url = document.getElementById("progUrl").value.trim();

    if(!url) return alert("Lütfen bir görsel URL'si girin!");

    try {
      await addDoc(collection(db, "dersProgramlari"), { sinif, url });
      alert(`${sinif} ders programı başarıyla eklendi!`);
      document.getElementById("progUrl").value = "";
    } catch(e) {
      alert("Hata: " + e.message);
    }
  });

  // YENİ GALERİ FOTOĞRAFI YÜKLE
  document.getElementById("galeriYukleBtn").addEventListener("click", async () => {
    const baslik = document.getElementById("galeriBaslik").value.trim();
    const url = document.getElementById("galeriUrl").value.trim();

    if(!url) return alert("Lütfen bir görsel URL'si girin!");

    try {
      await addDoc(collection(db, "galeri"), { baslik, url });
      alert("Galeri fotoğrafı başarıyla eklendi!");
      document.getElementById("galeriUrl").value = "";
      document.getElementById("galeriBaslik").value = "";
    } catch(e) {
      alert("Hata: " + e.message);
    }
  });

  // SİLME İŞLEMLERİ (KÜRESEL FONKSİYONLAR)
  document.progSil = async (id) => {
    if(confirm("Bu ders programını silmek istediğinize emin misiniz?")) {
      await deleteDoc(doc(db, "dersProgramlari", id));
    }
  };

  document.galeriSil = async (id) => {
    if(confirm("Bu resmi galeriden silmek istediğinize emin misiniz?")) {
      await deleteDoc(doc(db, "galeri", id));
    }
  };

  document.basvuruSil = async (id) => {
    if(confirm("Bu başvuruyu silmek istediğinize emin misiniz?")) {
      await deleteDoc(doc(db, "basvurular", id));
    }
  };
</script>

</body>
</html>
