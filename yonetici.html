<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Öngörü Akademi Yönetici Paneli</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#2f2f2f;
    color:white;
}

.container{
    width:90%;
    max-width:500px;
    margin:80px auto;
    background:#242424;
    padding:30px;
    border-radius:15px;
    text-align:center;
}

h1{
    color:#ff7a00;
}

input{
    width:90%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#111;
    color:white;
}


button{

    width:95%;
    padding:15px;
    background:#ff7a00;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;

}


button:hover{
    background:white;
    color:#ff7a00;
}


#panel{
    display:none;
}


</style>

</head>


<body>


<div class="container" id="login">


<h1>Yönetici Girişi</h1>


<input 
type="email"
id="email"
placeholder="E-posta">


<input
type="password"
id="password"
placeholder="Şifre">


<button id="loginBtn">
Giriş Yap
</button>


<p id="sonuc"></p>


</div>




<div class="container" id="panel">


<h1>
Öngörü Akademi Yönetim Paneli
</h1>


<p>
Giriş başarılı.
</p>


<button id="logoutBtn">
Çıkış Yap
</button>


</div>





<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import { 
getAuth,
signInWithEmailAndPassword,
signOut
} 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";





const firebaseConfig = {


apiKey: "AIzaSyCrT2ExfWOb5K5d4vL7oAoUHMRogqL4JzY",

authDomain: "ongoruakademi-73303-70a6a.firebaseapp.com",

projectId: "ongoruakademi-73303-70a6a",

storageBucket: "ongoruakademi-73303-70a6a.firebasestorage.app",

messagingSenderId: "406134243362",

appId: "1:406134243362:web:a88e82e2a2b835b259ca7b"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);





document.getElementById("loginBtn")
.addEventListener("click",()=>{


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



signInWithEmailAndPassword(
auth,
email,
password
)


.then(()=>{


document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";


})


.catch((error)=>{


document.getElementById("sonuc").innerHTML =
"Hata: "+error.message;


});


});






document.getElementById("logoutBtn")
.addEventListener("click",()=>{


signOut(auth);


document.getElementById("panel").style.display="none";

document.getElementById("login").style.display="block";


});




</script>


</body>
</html>
