<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yönetim Paneli | Öngörü Akademi</title>

<script src="guvenlik.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

background:#2f2f2f;
color:white;

}



header{

background:#1f1f1f;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:3px solid #ff7a00;

}



.logo{

display:flex;
align-items:center;
gap:15px;

}



.logo img{

width:75px;
height:75px;
background:white;
padding:7px;
border-radius:50%;
object-fit:contain;

}



.logo h1{

color:#ff7a00;
font-size:25px;

}





.cikis{

background:#ff7a00;
padding:12px 22px;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:600;
cursor:pointer;

}





.container{

padding:40px 8%;

}




.baslik{

color:#ff7a00;
margin-bottom:30px;

}





.kartlar{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;

}





.kart{

background:#383838;
padding:30px;
border-radius:20px;
text-align:center;
transition:.3s;

}




.kart:hover{

transform:translateY(-8px);

}




.kart i{

font-size:45px;
color:#ff7a00;
margin-bottom:15px;

}




.kart h2{

font-size:35px;

}




.alanlar{

display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
margin-top:40px;

}




.kutu{

background:#383838;
padding:30px;
border-radius:20px;

}





.kutu h2{

color:#ff7a00;
margin-bottom:20px;

}




input,
textarea{

width:100%;
padding:14px;
margin-bottom:15px;
background:#2f2f2f;
border:none;
border-radius:10px;
color:white;
outline:none;

}




textarea{

height:120px;
resize:none;

}





button{

background:#ff7a00;
color:white;
border:none;
padding:14px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}



button:hover{

background:white;
color:#ff7a00;

}




table{

width:100%;
border-collapse:collapse;

}



th,
td{

padding:12px;
border-bottom:1px solid #555;
text-align:left;

}





.sil{

background:#d9534f;
padding:7px 12px;
border-radius:8px;
font-size:12px;

}





.duyuru{

background:#2f2f2f;
padding:15px;
border-left:4px solid #ff7a00;
margin-bottom:15px;

}





@media(max-width:900px){

.kartlar,
.alanlar{

grid-template-columns:1fr;

}



header{

flex-direction:column;
gap:20px;

}

}


</style>

</head>


<body>


<header>


<div class="logo">

<img src="images/logo.png">


<h1>
Öngörü Akademi Yönetim
</h1>


</div>




<a onclick="cikisYap()" class="cikis">

<i class="fa-solid fa-right-from-bracket"></i>

Çıkış

</a>



</header>





<div class="container">


<h1 class="baslik">

Yönetici Paneli

</h1>





<div class="kartlar">



<div class="kart">

<i class="fa-solid fa-user-graduate"></i>

<h2 id="ogrenciSayisi">
0
</h2>

<p>
Öğrenci
</p>

</div>





<div class="kart">

<i class="fa-solid fa-chalkboard-user"></i>

<h2>
15
</h2>

<p>
Öğretmen
</p>

</div>





<div class="kart">

<i class="fa-solid fa-book"></i>

<h2>
8
</h2>

<p>
Ders
</p>

</div>





<div class="kart">

<i class="fa-solid fa-bullhorn"></i>

<h2 id="duyuruSayisi">
0
</h2>

<p>
Duyuru
</p>

</div>



</div>
<div class="alanlar">


<div class="kutu">


<h2>

<i class="fa-solid fa-user-plus"></i>

Yeni Öğrenci Ekle

</h2>



<input 
id="ad"
placeholder="Öğrenci Adı Soyadı">



<input 
id="sinif"
placeholder="Sınıf">



<input 
id="puan"
placeholder="Başarı Puanı">





<button onclick="ogrenciEkle()">

<i class="fa-solid fa-plus"></i>

Öğrenci Ekle

</button>



</div>







<div class="kutu">


<h2>

<i class="fa-solid fa-users"></i>

Öğrenci Listesi

</h2>




<table>


<thead>

<tr>

<th>
Ad
</th>


<th>
Sınıf
</th>


<th>
Puan
</th>


<th>
İşlem
</th>


</tr>


</thead>



<tbody id="ogrenciListe">


</tbody>



</table>



<div id="ogrenciBos" class="duyuru" style="display:none;">

Kayıtlı öğrenci bulunmuyor.

</div>



</div>









<div class="kutu">


<h2>

<i class="fa-solid fa-bullhorn"></i>

Duyuru Ekle

</h2>



<textarea 
id="duyuruMetin"
placeholder="Duyuru yazınız">
</textarea>



<button onclick="duyuruEkle()">

<i class="fa-solid fa-paper-plane"></i>

Duyuru Yayınla

</button>



</div>









<div class="kutu">


<h2>

<i class="fa-solid fa-bell"></i>

Mevcut Duyurular

</h2>



<div id="duyuruListe">


</div>



</div>





</div>


</div>







<script>


// YÖNETİCİ YETKİ KONTROLÜ

kontrolEt("yonetici");





let ogrenciler =

JSON.parse(
localStorage.getItem("ogrenciler")
) || [];





let duyurular =

JSON.parse(
localStorage.getItem("duyurular")
) || [];








// ÖĞRENCİ LİSTELEME


function ogrenciListele(){



let alan =

document.getElementById("ogrenciListe");



let bos =

document.getElementById("ogrenciBos");



alan.innerHTML="";





if(ogrenciler.length===0){


bos.style.display="block";


}

else{


bos.style.display="none";



ogrenciler.forEach(function(o,index){



alan.innerHTML += `

<tr>

<td>${o.ad}</td>

<td>${o.sinif}</td>

<td>${o.puan}</td>

<td>

<button 
class="sil"
onclick="ogrenciSil(${index})">

Sil

</button>

</td>

</tr>

`;



});


}



document.getElementById("ogrenciSayisi").innerHTML =

ogrenciler.length;



}








// ÖĞRENCİ EKLEME


function ogrenciEkle(){



let ad =

document.getElementById("ad").value.trim();



let sinif =

document.getElementById("sinif").value.trim();



let puan =

document.getElementById("puan").value.trim();






if(ad==="" || sinif==="" || puan===""){


alert("Tüm alanları doldurun!");

return;


}





ogrenciler.push({

ad:ad,

sinif:sinif,

puan:puan

});






localStorage.setItem(

"ogrenciler",

JSON.stringify(ogrenciler)

);






document.getElementById("ad").value="";

document.getElementById("sinif").value="";

document.getElementById("puan").value="";





ogrenciListele();



}





// ÖĞRENCİ SİLME


function ogrenciSil(index){



if(confirm("Öğrenci silinsin mi?")){


ogrenciler.splice(index,1);



localStorage.setItem(

"ogrenciler",

JSON.stringify(ogrenciler)

);



ogrenciListele();



}



}





// DUYURU EKLEME


function duyuruEkle(){



let metin =

document.getElementById("duyuruMetin").value.trim();





if(metin===""){


alert("Duyuru yazınız!");

return;


}




duyurular.push(metin);





localStorage.setItem(

"duyurular",

JSON.stringify(duyurular)

);





document.getElementById("duyuruMetin").value="";




duyuruListele();



}


// DUYURU LİSTELEME


function duyuruListele(){



let alan =

document.getElementById("duyuruListe");



alan.innerHTML="";





if(duyurular.length===0){


alan.innerHTML = `

<div class="duyuru">

Henüz duyuru bulunmuyor.

</div>

`;



}

else{


duyurular.forEach(function(d,index){



alan.innerHTML += `

<div class="duyuru">

${d}


<br><br>


<button 
class="sil"
onclick="duyuruSil(${index})">

Sil

</button>


</div>

`;



});



}







document.getElementById("duyuruSayisi").innerHTML =

duyurular.length;



}







// DUYURU SİLME


function duyuruSil(index){



if(confirm("Duyuru silinsin mi?")){


duyurular.splice(index,1);



localStorage.setItem(

"duyurular",

JSON.stringify(duyurular)

);



duyuruListele();



}



}









// SAYFA AÇILIŞI


ogrenciListele();


duyuruListele();





</script>


</body>

</html>
